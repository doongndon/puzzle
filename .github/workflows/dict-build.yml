name: 사전 뜻풀이 만들기

# 국립국어원 사전 공개 사본(한국어기초사전·우리말샘, CC BY-SA 2.0 KR)에서
# 퍼즐 낱말의 뜻풀이를 뽑아 dict.js로 저장한다. 낱말을 바꾼 뒤 손으로 돌린다.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dict-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 도구 설치
        run: pip install --quiet pyarrow
      - name: 퍼즐 낱말 목록 뽑기
        run: node .github/scripts/list-words.js > "$RUNNER_TEMP/words.json"
      - name: 사전에서 뜻풀이 뽑기
        run: python .github/scripts/build_dict.py "$RUNNER_TEMP/words.json" "$RUNNER_TEMP/dict" dict.js
      - name: 바뀌었으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dict.js
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "사전 뜻풀이 갱신 (국립국어원 한국어기초사전·우리말샘)"
            git push
          fi
