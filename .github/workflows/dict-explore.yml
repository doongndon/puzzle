name: 사전 데이터 살펴보기

# 공개된 국립국어원 사전 사본(Hugging Face)의 생김새를 확인한다.
# 손으로 돌릴 때만 실행된다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 도구 설치
        run: pip install --quiet pyarrow
      - name: 데이터 살펴보기
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.request
          import pyarrow.parquet as pq

          DATASETS = ["hac541309/woori_spring_dict", "hac541309/basic_korean_dict", "hac541309/stdict_kor"]
          SAMPLES = ["김밥", "사과", "도토리묵", "윷놀이"]

          def get_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "puzzle-dict-explore"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.loads(r.read())

          for ds in DATASETS:
              print("=" * 20, ds, flush=True)
              try:
                  info = get_json(f"https://huggingface.co/api/datasets/{ds}")
              except Exception as e:
                  print("정보 못 받음:", e); continue
              print("라이선스 태그:", [t for t in info.get("tags", []) if t.startswith("license")])
              files = [s["rfilename"] for s in info.get("siblings", [])]
              print("파일:", files)
              for f in [x for x in files if x.endswith(".parquet")]:
                  path = "/tmp/" + f.replace("/", "_")
                  subprocess.run(["curl", "-sSL", "--fail", "-o", path,
                                  f"https://huggingface.co/datasets/{ds}/resolve/main/{f}"], check=True)
                  pf = pq.ParquetFile(path)
                  print(f"\n파일 {f}: {os.path.getsize(path)//1024} KB, 행 {pf.metadata.num_rows}")
                  print("구조:", pf.schema_arrow)
                  first = next(pf.iter_batches(batch_size=3)).to_pylist()
                  for row in first:
                      print("앞부분:", json.dumps(row, ensure_ascii=False)[:700])
                  found = {w: 0 for w in SAMPLES}
                  for batch in pf.iter_batches(batch_size=20000):
                      for row in batch.to_pylist():
                          s = json.dumps(row, ensure_ascii=False)
                          head = s[:60]
                          for w in SAMPLES:
                              if found[w] < 2 and w in head:
                                  print(f"보기[{w}]:", s[:900]); found[w] += 1
                      if all(v >= 2 for v in found.values()):
                          break
          PY
